<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Weight Calculator</title>
    <link rel="stylesheet" href="ideal.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
</head>
<body>

    <div id="container">
        <h1>Ideal Weight Calculator</h1>

        <div id="ideal">
            <a href="/index.html"><-Back</a>
            <h2>Enter your details below:</h2>

                <form id="form">

                    <label>Name</label> <br>
                    <input type="text" class="name" required> <br> <br>

                    <label>Weight (kg)</label><br>
                    <input type="number" class="weight" min="0" step="0.1" required> <br> <br>

                    <label>Gender</label>
                    <div class="radios">
                        <input type="radio" name="gender" class="male" value="male" id="male" required>
                        <label for="male">Male</label> <br>

                        <input type="radio" name="gender" class="female" value="female" id="female" required>
                        <label for="female">Female</label> <br> <br>

                    </div>

                    <label>Height (cm)</label> <br>
                    <input type="number" class="height" id="height" step="0.01" min="0" required>

                    <button class="btn submit-btn" type="submit">
                        Submit!
                    </button>

                </form> <br>

                <div class="output-box hide">
                    <p>

                    </p>
                </div>

        </div>
    </div>
    
    <script src="ideal.js"></script>
</body>
</html>

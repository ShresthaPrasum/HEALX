<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Calorie Calculator</title>
    <link rel="stylesheet" href="m.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
</head>
<body>

    <div id="container">

        <h1>Maintenance Calorie Calculator</h1>

        <div id="maintain">

            <a href="/index.html">
                <-Back
            </a>

            <h2>Enter the asked details!</h2>

            <form id="form">

                <label>Name</label> <br>
                <input type="text" id="name"> <br> <br>

                <label>Height (cm)</label> <br>
                <input type="number" class="height" step="0.1"> <br> <br>

                <label>Weight (kg)</label> <br>
                <input type="number" class="weight" step="0.1"> <br> <br>

                <label for="age">Age (years)</label> <br>
                <input type="number" class="age"> <br> <br>

                <label>Gender</label> <br>

                <div class="radios">

                    <input type="radio" name="gender" value="male" class="male">
                    <label>Male</label> <br>

                    <input type="radio" name="gender" value="female" class="female">
                    <label>Female</label> <br> <br>

                </div>

                <label>
                    Physical Activity Level
                </label>

                <div class="radios">

                    <!-- <input type="radio" name="lvl" value="no">
                    <label>I do not exercise</label> <br>

                    <input type="radio" name="lvl" value="regularly">
                    <label>I do exercise regularly.</label> <br>

                    <input type="radio" name="lvl" value="job">
                    <label>I have a physical job!</label> <br>

                    <input type="radio" name="lvl" value="professional">
                    <label>I am a professional athlete.</label> <br> -->

                    <select name="lvl" id="lvl">
                        <option value="no">No Exercise</option>
                        <option value="regularly">Regular Exercise</option>
                        <option value="job">Physical Job</option>
                        <option value="professional">Professional Athlete</option>
                    </select>

                </div>

                <button class="btn submit-btn">
                    Submit
                </button>

            </form>

            <div class="output-box hide">
                <p>

                </p>
            </div>

        </div>

    </div>
    
    <script src="m.js"></script>
</body>
</html>

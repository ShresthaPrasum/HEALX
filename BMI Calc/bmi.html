<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="bmi.css">
</head>
<body>

    <div class="container">
        <div id="metric" class="metric">
            
            <div class="select-mode">
                <button class="metric active">Metric</button>

                <button class="otherr">Other</button>

            </div>

            <h2>Enter your asked details below:</h2>
            
            <form id="metric-form"> <br>
                <label>Height (m)</label> <br>
                <input type="number" class="height" step="0.01" min="0"> <br> <br>

                <label>Weight (kg)</label> <br>
                <input type="number" class="weight" step="0.01" min="0"> <br> <br>

                <label>Gender</label>
                <div class="radios"> <br>

                <input type="radio" value="male" class="radio" name="gender">
                <label>Male</label> <br>

                <input type="radio" value="female" class="radio" name="gender">
                <label>Female</label> <br>

                <input type="radio" value="nottosay" class="radio" name="gender">
                <label>Rather not say</label>

                </div>

                <button class="btn submit-btn" type="submit">
                    Submit
                </button>

            </form>

            <div class="output-box" class="hide">

            </div>

        </div>

        <div class="other hide" id="other-unitss">

            <div class="select-mode">
                <button class="metric">Metric</button>
                <button class="otherr active">Other</button>
            </div>

            <h2>Enter your requested details!</h2>

            <form id="other-form"> <br>
                
                <label>Height (in)</label> <br>
                <input type="number" class="heightt" step="0.01" min="0"> <br> <br>

                <label>Weight (lbs)</label> <br>
                <input type="number" class="weightt" min="0" step="0.01"> <br> <br>

                <label>Age (years)</label> <br>
                <input type="number" class="agee" min="0" step="1"> <br> <br>

                <label>Gender</label>

                <div class="radios">
                    <br>

                    <input type="radio" value="male" class="radio" name="genderr">
                    <label>Male</label> <br>

                    <input type="radio" value="female" class="radio" name="genderr">
                    <label>Female</label> <br>

                    <input type="radio" value="nottosay" class="radio" name="genderr">
                    <label>Rather Not to Say</label> <br>

                </div>

                    <button class="btn submit-btn">
                        Submit
                    </button>

            </form>

            <div class="output-boxx" class="hide">

            </div>

        </div>
    </div>
    
    <script src="bmi.js"></script>
</body>
</html>

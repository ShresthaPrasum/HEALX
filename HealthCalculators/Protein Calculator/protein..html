<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Calculator</title>
    <link rel="stylesheet" href="protein.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pixelify+Sans:wght@400..700&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
</head>
<body>

    <div id="container">

        <h1>Protein Calculator</h1>

        <div id="protein">

            <a href="/index.html">
                <-Back
            </a>

            <h2>Enter your details below:</h2>

            <form id="form">

                <label>Name</label> <br>
                <input type="text" id="name"> <br> <br>

                <label>Height (cm):</label> <br>
                <input type="number" class="height" step="0.1"> <br> <br>

                <label>Weight (kg)</label> <br>
                <input type="number" class="weight" step="0.1"> <br> <br>

                <label>Age (years)</label> <br>
                <input type="number" class="age"> <br> <br>

                <label>Gender</label> <br>

                <div class="radios">

                    <input type="radio" name="gender" value="male" class="male" id="male">
                    <label for="male">Male</label> <br>

                    <input type="radio" name="gender" value="female" class="female" id="female">
                    <label for="female">Female</label><br> <br>

                </div>

                <label>Activity</label> <br>

                <div class="radios">
                    
                    <!-- <input type="radio" name="activity" value="no-workout">
                    <label>No workout</label> <br>

                    <input type="radio" name="activity" value="1-2-times">
                    <label>1-2 times a week</label> <br>

                    <input type="radio" name="activity" value="2-3-times">
                    <label>2-3 times a week</label> <br>

                    <input type="radio" name="activity" value="3-5-times">
                    <label>3-5 times a week</label> <br>

                    <input type="radio" name="activity" value="6-7-times">
                    <label>6-7 times a week</label> <br>

                    <input type="radio" name="activity" value="professional">
                    <label>Professional Athlete</label> <br> <br> -->

                    <select name="activity" id="activity">
                        <option value="no-workout">No workout</option>
                        <option value="1-2-times">1-2 times a week</option>
                        <option value="2-3-times">2-3 times a week</option>
                        <option value="3-5-times">3-5 times a week</option>
                        <option value="6-7-times">6-7 times a week</option>
                        <option value="professional">Professional Athlete</option>
                    </select>
                </div>

                <button class="btn submit-btn">
                    Submit
                </button>

            </form>

            <div class="output-box hide">
                <p>
                    
                </p>
            </div>

        </div>

    </div>
    
    <script src="protein.js"></script>
</body>
</html>

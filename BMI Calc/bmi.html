<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="bmi.css">
</head>
<body>

    <div class="container">
        <div id="metric" class="metric hide">
            
            <div class="select-mode">
                <button class="metric active">Metric</button>

                <button class="other">Other</button>

            </div>

            <h2>Enter your asked details below:</h2>
            
            <form> <br>
                <label>Height (m)</label> <br>
                <input type="number" class="height" step="0.01" min="0"> <br> <br>

                <label>Weight (kg)</label> <br>
                <input type="number" class="weight" step="0.01" min="0"> <br> <br>
                
                <label>Age (years)</label><br>
                <input type="number" class="age" min="0" step="1"><br> <br>

                <label>Gender</label>
                <div class="radios"> <br>

                <input type="radio" value="male" class="radio" name="gender">
                <label>Male</label> <br>

                <input type="radio" value="female" class="radio" name="gender">
                <label>Female</label> <br>

                <input type="radio" value="nottosay" class="radio" name="gender">
                <label>Rather not say</label>

                </div>

                <button class="btn submit-btn" type="submit">
                    Submit
                </button>

            </form>

            <div id="output-box" class="hide">

            </div>

        </div>

        <div class="other">

            <div class="select-mode">
                <button class="metric">Metric</button>
                <button class="other active">Other</button>
            </div>

            <h2>Enter your requested details!</h2>

            <form> <br>
                
                <label>Height (in)</label> <br>
                <input type="number" class="height" step="0.01" min="0"> <br> <br>

                <label>Weight (lbs)</label>
                <input type="number" class="age" min="0" step="0.01"> <br> <br>

                <label>Age (years)</label>
                <input type="number" class="age" min="0"> <br> <br>

                <label>Gender</label>

                <div class="radios">
                    <br>

                    <input type="radio" value="male" class="radio" name="gender">
                    <label>Male</label>

                    <input type="radio" value="female" class="radio" name="gender">
                    <label>Female</label>

                    <input type="radio">

                </div>

            </form>

        </div>
    </div>
    
    <script src="bmi.js"></script>
</body>
</html>

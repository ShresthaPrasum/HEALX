<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Calculator</title>
    <link rel="stylesheet" href="protein.css">
</head>
<body>

    <div id="container">

        <h1>Protein Calculator</h1>

        <div id="protein">
            <h2>Enter the requested details listed below:</h2>

            <form id="form">

                <label>Height (cm):</label> <br>
                <input type="number" class="Height" step="0.1"> <br> <br>

                <label>Weight (kg)</label> <br>
                <input type="number" class="weight" step="0.1"> <br> <br>

                <label>Age (years)</label> <br>
                <input type="number" class="age"> <br> <br>

                <label>Gender</label> <br>

                <div class="radios">

                    <input type="radio" name="gender" value="male" class="male">
                    <label>Male</label> <br>

                    <input type="radio" name="gender" value="female" class="female">
                    <label>Female</label><br> <br>

                </div>

                <label>Activity</label> <br>

                <div class="radios">

                    <input type="radio" name="activity" value="no-workout">
                    <label>No workout</label> <br>

                    <input type="radio" name="activity" value="1-2-times">
                    <label>1-2 times a week</label> <br>

                    <input type="radio" name="activity" value="2-3-times">
                    <label>2-3 times a week</label> <br>

                    <input type="radio" name="activity" value="3-5-times">
                    <label>3-5 times a week</label> <br>

                    <input type="radio" name="activity" value="6-7-times">
                    <label>6-7 times a week</label> <br>

                    <input type="radio" name="activity" value="professional">
                    <label>Professional Athlete</label> <br> <br>
                    
                </div>

                <button class="btn submit-btn">
                    Submit
                </button>

            </form>

            <div id="output-box hide">

            </div>

        </div>

    </div>
    
    <script src="protein.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Defic Calculator</title>
    <link rel="stylesheet" href="c.css">
</head>
<body>

    <div id="container">

        <h1>Calorie Defict Calculator</h1>

        <div id="Calculator">
            <h2>Enter the asked details listed below:</h2>

            <form id="form">

                <label>Height (cm)</label> <br>
                <input type="number" class="height" step="0.5" min="0"> <br><br>

                <label>Weight (kg)</label> <br>
                <input type="number" class="weight" step="0.1" min="0"> <br> <br>

                <label>Energy Intake (kcal/day)</label> <br>
                <input type="number" class="energy-intake" step="0.01" min="0"> <br> <br>

                <label>Age (years)</label> <br>
                <input type="number" class="age" min="0"> <br> <br>

                <label>Activity Level (multiplier)</label> <br>
                <input type="number" class="pal-multiplier" min="0" step="0.01"> <br> <br>

                <label>Gender</label>

                <div class="radios">

                    <input type="radio" name="gender" value="male" class="radio">
                    <label>Male</label>

                    <input type="radio" name="gender" value="female" class="radio">
                    <label>Female</label>

                </div>

                <button class="btn submit-btn">
                    Calculate
                </button>

            </form>

        </div>

    </div>
    
    <script src="c.js"></script>
</body>
</html>

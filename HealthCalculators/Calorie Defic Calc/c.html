<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Defic Calculator</title>
    <link rel="stylesheet" href="c.css">
</head>
<body>

    <div id="container">

        <h1>Calorie Defict Calculator</h1>

        <div id="Calculator">
            <h2>Enter the asked details listed below:</h2>

            <form id="form">

                <label>Name </label> <br>
                <input type="text" class="name"> <br><br>

                <label>Weight (lbs)</label> <br>
                <input type="number" class="weight" step="0.1" min="0"> <br> <br>

                <label>Target Weight</label> <br>
                <input type="number" class="target-weight" step="1" min="0"> <br> <br>

                <label>Target Date</label> <br>
                <input type="date" class="date"> <br> <br>

                <!-- <label>Gender</label>

                <div class="radios">

                    <input type="radio" name="gender" value="male" class="radio">
                    <label>Male</label> <br>

                    <input type="radio" name="gender" value="female" class="radio">
                    <label>Female</label> <br> 

                </div> -->

                <button class="btn submit-btn">
                    Calculate
                </button>

            </form>

            <div id="output-box" class="hide">
                <p></p>
            </div>

        </div>

    </div>
    
    <script src="c.js"></script>
</body>
</html>
